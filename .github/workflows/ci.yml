name: Verify Passwords OTP
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: otp-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    name: JS, pinned client, package and PHP contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - name: Locked dependencies, unit tests, audit and deterministic package
        run: python3 scripts/local.py --build
      - name: PHP 8.5 syntax and controller contracts
        run: |
          docker run --rm --network none --read-only --tmpfs /tmp:rw,nosuid,nodev,noexec,size=16m -v "$PWD:/src:ro" -w /src php:8.5-cli sh -ec '
            find appinfo lib templates tests/php -name "*.php" -print0 | xargs -0 -n1 php -l >/dev/null
            php tests/php/security.php
            php tests/php/dependencies.php
          '
  desktop:
    name: Production Vue bundle in Chromium (synthetic HTTPS API)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - name: Build the actual production application
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Isolated Python browser driver
        run: |
          python3 -m venv .build/browser-venv
          .build/browser-venv/bin/python -m pip install --disable-pip-version-check playwright==1.62.0
      - name: Nextcloud Vue forms, dialog, keyboard and reflow
        run: |
          export CHROME_BIN="$(command -v google-chrome || command -v chromium)"
          test -n "$CHROME_BIN"
          .build/browser-venv/bin/python tests/browser/desktop.py --output .build/browser
  candidate:
    name: Verification artifact (not a GitHub Release)
    needs: [checks, desktop]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Compare independent builds in the pinned toolchain
        run: |
          bash scripts/release-container.sh HEAD .build/package
          bash scripts/release-container.sh HEAD .build/rebuild
          diff -qr .build/package .build/rebuild
      - name: Reproduce the published 1.1.4 archives
        run: |
          bash scripts/release-container.sh v1.1.4 .build/v114
          cd .build/v114
          sha256sum -c <<'SUMS'
          abe7a5c86f6872ee74689bb58ed7bc218ae9834826b4a6bdf04da59cbe53cea1  passwords_otp-1.1.4.zip
          23667190b1a5b529041acd1351b7e72a42df7f434ef546fbc7064dafb6526720  passwords_otp-1.1.4.tar.gz
          SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: passwords-otp-unreleased-test-package
          path: .build/package/*
          retention-days: 30
# Actual Nextcloud integration and target AIO acceptance are separate gates.
# A synthetic Chromium result or uploaded artifact does not certify a release.
