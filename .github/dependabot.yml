# The zero limits pause routine Dependabot version-update pull requests.
# Configure security alerts and security-update pull requests separately
# in the repository's security settings.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
