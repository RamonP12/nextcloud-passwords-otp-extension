# Version-update PRs are intentionally paused while GitHub Actions CI is
# disabled. The zero limit affects Dependabot VERSION updates only.
# Security alerts and security-update pull requests are configured
# independently in Repository Settings -> Advanced Security; this file does
# not enable or disable those repository settings.
# Revisit the version-update limit when CI is re-enabled.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
