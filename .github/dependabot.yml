# Version-update PRs are intentionally paused while GitHub Actions CI is
# disabled. The zero limit affects Dependabot VERSION updates only.
# SECURITY updates are configured independently in Repository Settings ->
# Advanced Security -> Dependabot security updates. Enable alerts and security
# updates after the repository is public; do not assume this YAML enables them.
# Revisit the version-update limit when CI is re-enabled.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
